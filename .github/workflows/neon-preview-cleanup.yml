name: Clean up Neon preview branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete:
    if: vars.NEON_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Delete preview/pr-${{ github.event.number }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: npx -y neonctl@latest branches delete "preview/pr-${{ github.event.number }}" --project-id "${{ vars.NEON_PROJECT_ID }}" || true
