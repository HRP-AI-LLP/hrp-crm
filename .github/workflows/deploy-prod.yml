name: Deploy production

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Snapshot, migrate Neon "main" and deploy synapse-prod
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Add required reviewers to the "production" environment in GitHub to gate releases.
    environment: production
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Snapshot production before migrating (keeps only the latest snapshot; free plan allows 10 branches)
        run: |
          for b in $(npx -y neonctl@latest branches list --project-id "$NEON_PROJECT_ID" --output json | jq -r '.[] | select(.name | startswith("backup/pre-deploy-")) | .name'); do
            npx -y neonctl@latest branches delete "$b" --project-id "$NEON_PROJECT_ID"
          done
          npx -y neonctl@latest branches create --project-id "$NEON_PROJECT_ID" --name "backup/pre-deploy-${GITHUB_SHA::7}" --parent main --no-compute
      - name: Migrate production database
        run: |
          export DATABASE_URL_OWNER="$(npx -y neonctl@latest connection-string main --project-id "$NEON_PROJECT_ID" --role-name neondb_owner --database-name neondb)"
          echo "::add-mask::$DATABASE_URL_OWNER"
          pnpm --filter @synapse/db migrate
      - name: Build web
        run: pnpm --filter @synapse/web build
      - name: Deploy Worker
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env production
