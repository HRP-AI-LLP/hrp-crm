# Quick check of a pull request into main (about 2–3 minutes).
# The full test suite runs on your computer (`pnpm local:test`) — it needs Postgres and takes
# much longer, so it runs here only when you start this workflow by hand with "full tests".
name: Check

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'mobile/**', 'tools/**', 'connectors/**', '.vscode/**']
  workflow_dispatch:
    inputs:
      full:
        description: Also run the database and API test suites (slow, ~15 minutes)
        type: boolean
        default: false

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Build the web app
        run: pnpm --filter @synapse/web build
      - name: Bundle the Worker (dry run)
        working-directory: apps/api
        run: pnpm exec wrangler deploy --dry-run --env production --outdir dist

  tests:
    name: Test suites
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @synapse/db test
      - run: pnpm --filter @synapse/api test
